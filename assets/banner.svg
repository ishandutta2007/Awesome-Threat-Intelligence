er:drop-shadow(0 0 10px rgba(0,242,254,.4))}50%{filter:drop-shadow(0 0 25px rgba(0,242,254,.8))}}.radar-arm{transform-origin:980px 210px;animation:radarSweep 6s linear infinite}.ring-pulse-1,.ring-pulse-2{transform-origin:980px 210px;animation:pulseRing1 3.5s cubic-bezier(.2,.8,.2,1) infinite}.ring-pulse-2{animation:pulseRing2 3.5s cubic-bezier(.2,.8,.2,1) infinite 1.75s}.flow-line{stroke-dasharray:6 6;animation:dashFlow 2s linear infinite}.floating-pill-1{animation:floatSlow1 4s ease-in-out infinite}.floating-pill-2{animation:floatSlow2 4.5s ease-in-out infinite}.blinking-node{animation:blinkTarget 2.5s ease-in-out infinite}.banner-main-title{font-weight:900;letter-spacing:-.5px;animation:titleGlow 4s ease-in-out infinite}.banner-main-title,.banner-sub{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)"/><g stroke="#1e293b" stroke-width=".7" opacity=".35"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="150" x2="150" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="450" x2="450" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="750" x2="750" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1050" x2="1050" y1="0" y2="420"/></g><circle cx="980" cy="210" r="160" fill="#00f2fe" filter="url(#heavyGlow)" opacity=".06"/><circle cx="200" cy="180" r="130" fill="#7f00ff" filter="url(#heavyGlow)" opacity=".08"/><g id="radar-system"><circle cx="980" cy="210" r="150" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity=".25"/><circle cx="980" cy="210" r="110" fill="none" stroke="#00f2fe" stroke-dasharray="3 4" stroke-width="1" opacity=".3"/><circle cx="980" cy="210" r="70" fill="none" stroke="#00f2fe" stroke-width="1" opacit