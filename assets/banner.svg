<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Cyber Cyan / Blue Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f5a0" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CSS Animations -->
    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRing1 {
        0% { r: 25px; opacity: 0.9; }
        50% { opacity: 0.5; }
        100% { r: 150px; opacity: 0; }
      }
      @keyframes pulseRing2 {
        0% { r: 25px; opacity: 0; }
        30% { opacity: 0.8; }
        100% { r: 175px; opacity: 0; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      @keyframes blinkTarget {
        0%, 100% { opacity: 0.2; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes titleGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
        50% { filter: drop-shadow(0 0 25px rgba(0, 242, 254, 0.8)); }
      }

      .radar-arm {
        transform-origin: 980px 210px;
        animation: radarSweep 6s linear infinite;
      }
      .ring-pulse-1 {
        transform-origin: 980px 210px;
        animation: pulseRing1 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .ring-pulse-2 {
        transform-origin: 980px 210px;
        animation: pulseRing2 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 1.75s;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2s linear infinite;
      }
      .floating-pill-1 {
        animation: floatSlow1 4s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 4.5s ease-in-out infinite;
      }
      .blinking-node {
        animation: blinkTarget 2.5s ease-in-out infinite;
      }
      .banner-main-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
        animation: titleGlow 4s ease-in-out infinite;
      }
      .banner-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Grid Overlay for Cyber Feel -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glow Behind Right Radar Section -->
  <circle cx="980" cy="210" r="160" fill="#00f2fe" opacity="0.06" filter="url(#heavyGlow)" />
  <circle cx="200" cy="180" r="130" fill="#7f00ff" opacity="0.08" filter="url(#heavyGlow)" />

  <!-- Animated Threat Radar Screen on the Right -->
  <g id="radar-system">
    <!-- Static Radar Rings -->
    <circle cx="980" cy="210" r="150" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.25" />
    <circle cx="980" cy="210" r="110" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" stroke-dasharray="3 4" />
    <circle cx="980" cy="210" r="70" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.4" />
    <circle cx="980" cy="210" r="30" fill="none" stroke="#00f2fe" stroke-width="1.2" opacity="0.5" />

    <!-- Crosshairs -->
    <line x1="820" y1="210" x2="1140" y2="210" stroke="#00f2fe" stroke-width="1" opacity="0.25" stroke-dasharray="2 4" />
    <line x1="980" y1="50" x2="980" y2="370" stroke="#00f2fe" stroke-width="1" opacity="0.25" stroke-dasharray="2 4" />

    <!-- Pulsing Radar Echo Rings -->
    <circle class="ring-pulse-1" cx="980" cy="210" r="30" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <circle class="ring-pulse-2" cx="980" cy="210" r="30" fill="none" stroke="#00f5a0" stroke-width="1.5" />

    <!-- Rotating Radar Sweep Wedge -->
    <g class="radar-arm">
      <path d="M 980 210 L 1120 180 A 150 150 0 0 0 1100 130 Z" fill="url(#radarSweepGrad)" />
      <line x1="980" y1="210" x2="1120" y2="180" stroke="#00f2fe" stroke-width="2" opacity="0.9" />
    </g>

    <!-- Radar Detected Targets (Blinking) -->
    <g class="blinking-node">
      <circle cx="930" cy="140" r="4.5" fill="#ef4444" filter="url(#cyanGlow)" />
      <text x="942" y="144" fill="#fca5a5" font-size="11" font-family="monospace">APT-29 [Detected]</text>
    </g>
    <g class="blinking-node" style="animation-delay: 1.2s;">
      <circle cx="1040" cy="270" r="4" fill="#f59e0b" filter="url(#cyanGlow)" />
      <text x="1052" y="274" fill="#fde68a" font-size="11" font-family="monospace">C2 Beacon: Active</text>
    </g>
    <g class="blinking-node" style="animation-delay: 0.6s;">
      <circle cx="1020" cy="120" r="4" fill="#10b981" filter="url(#cyanGlow)" />
      <text x="1032" y="124" fill="#a7f3d0" font-size="11" font-family="monospace">STIX TAXII 2.1</text>
    </g>
  </g>

  <!-- Network Connecting Lines with Animated Dash Pulses -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.45">
    <path class="flow-line" d="M 120 70 L 400 70 L 480 110" fill="none" />
    <path class="flow-line" d="M 680 110 L 780 70 L 980 70" fill="none" />
    <path class="flow-line" d="M 100 350 L 360 350 L 440 310" fill="none" />
    <path class="flow-line" d="M 680 310 L 780 350 L 950 350" fill="none" />
  </g>

  <!-- Floating Feature Pills (Non-Obstructing) -->
  <!-- Pill 1: Top Right Area -->
  <g class="floating-pill-1" transform="translate(680, 48)">
    <rect width="180" height="32" rx="16" fill="url(#badgeGrad)" stroke="#00f2fe" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="4" fill="#00f5a0" />
    <text x="32" y="21" fill="#e2e8f0" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">STIX 2.1 &amp; TAXII</text>
  </g>

  <!-- Pill 2: Top Left Area -->
  <g class="floating-pill-2" transform="translate(140, 48)">
    <rect width="195" height="32" rx="16" fill="url(#badgeGrad)" stroke="#7f00ff" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="4" fill="#c084fc" />
    <text x="32" y="21" fill="#e2e8f0" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">MITRE ATT&amp;CK Mapping</text>
  </g>

  <!-- Pill 3: Bottom Left Area -->
  <g class="floating-pill-1" transform="translate(140, 342)">
    <rect width="180" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#e2e8f0" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">IOC &amp; TTP Analysis</text>
  </g>

  <!-- Pill 4: Bottom Right Area -->
  <g class="floating-pill-2" transform="translate(680, 342)">
    <rect width="190" height="32" rx="16" fill="url(#badgeGrad)" stroke="#00f5a0" stroke-width="1.2" opacity="0.9" />
    <circle cx="18" cy="16" r="4" fill="#00f5a0" />
    <text x="32" y="21" fill="#e2e8f0" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Dark Web &amp; OSINT Feeds</text>
  </g>

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed in foreground, crystal clear) -->
  <g id="foreground-text">
    <!-- Cyber Shield Icon -->
    <g transform="translate(80, 130)">
      <path d="M 35 0 L 70 14 C 70 45 48 72 35 80 C 22 72 0 45 0 14 Z" fill="url(#shieldGrad)" opacity="0.95" filter="url(#cyanGlow)" />
      <!-- Inner Shield Details -->
      <path d="M 35 10 L 60 21 C 60 45 42 63 35 69 C 28 63 10 45 10 21 Z" fill="#060913" opacity="0.7" />
      <!-- Target Reticle Inside Shield -->
      <circle cx="35" cy="38" r="14" fill="none" stroke="#00f2fe" stroke-width="2" />
      <circle cx="35" cy="38" r="6" fill="#00f5a0" />
      <line x1="35" y1="18" x2="35" y2="58" stroke="#00f2fe" stroke-width="1.5" />
      <line x1="15" y1="38" x2="55" y2="38" stroke="#00f2fe" stroke-width="1.5" />
    </g>

    <!-- Main Title -->
    <text class="banner-main-title" x="175" y="172" fill="#ffffff" font-size="44">
      AWESOME <tspan fill="url(#cyanGrad)">THREAT INTELLIGENCE</tspan>
    </text>

    <!-- Subtitle -->
    <text class="banner-sub" x="175" y="212" fill="#94a3b8" font-size="18" font-weight="500" letter-spacing="0.2px">
      Curated Cyber Threat Intelligence (CTI) Platforms, Adversary Tracking &amp; SOC Operations
    </text>

    <!-- Secondary Meta / Tagline -->
    <g transform="translate(175, 238)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="62" y="17" fill="#38bdf8" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">⚡ SAAS &amp; OSS</text>

      <!-- Tag 2 -->
      <rect x="135" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="202" y="17" fill="#00f5a0" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">🛡️ SOC ENRICHMENT</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="352" y="17" fill="#c084fc" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">🎯 ADVERSARY TTPS</text>

      <!-- Tag 4 -->
      <rect x="435" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="507" y="17" fill="#f59e0b" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">🌐 THREAT SHARING</text>
    </g>
  </g>
</svg>
